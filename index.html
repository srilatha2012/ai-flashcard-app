<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards Study App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Flashcards Study App</h1>
      <button type="button" class="primary-btn" id="open-modal-btn">New Deck</button>
    </header>

    <div class="layout">
      <aside class="deck-sidebar" aria-label="Flashcard decks">
        <div class="sidebar-header">
          <h2>Decks</h2>
          <button type="button" class="icon-btn" id="edit-deck-btn" aria-label="Edit active deck">✎</button>
        </div>
        <ul class="deck-list" id="deck-list"></ul>
      </aside>

      <main class="study-panel">
        <section class="deck-view" aria-labelledby="deck-title">
          <div class="deck-meta">
            <div>
              <p class="deck-label">Current deck</p>
              <h2 id="deck-title">General Knowledge</h2>
            </div>
            <button type="button" class="secondary-btn">New Card</button>
          </div>

          <div class="toolbar" role="toolbar" aria-label="Deck tools">
            <label class="search-field">
              <span class="sr-only">Search cards</span>
              <input type="search" placeholder="Search cards" />
            </label>
            <button type="button">Shuffle</button>
          </div>

          <article class="flashcard" aria-label="Flashcard">
            <div class="flashcard-face">
              <h3>Front</h3>
              <p>What is the capital of France?</p>
            </div>
            <div class="flashcard-face back">
              <h3>Back</h3>
              <p>Paris</p>
            </div>
          </article>

          <div class="card-controls" role="group" aria-label="Flashcard controls">
            <button type="button">Previous</button>
            <button type="button">Flip</button>
            <button type="button">Next</button>
          </div>
        </section>
      </main>
    </div>

    <footer>
      <p>Tip: Flip the card to reveal the answer, then move to the next one.</p>
    </footer>

    <div class="modal" id="deck-modal" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
      <div class="modal-dialog" role="document">
        <button class="modal-close" type="button" aria-label="Close dialog">×</button>
        <h2 id="modal-title">New Deck</h2>
        <form id="deck-form">
          <label for="deck-name">Deck name</label>
          <input id="deck-name" name="deckName" type="text" required maxlength="40" />
          <div class="modal-actions">
            <button type="button" class="danger-btn" id="delete-deck-btn" hidden>Delete Deck</button>
            <button type="button" class="secondary-btn" id="cancel-modal-btn">Cancel</button>
            <button type="submit" class="primary-btn">Save Deck</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
