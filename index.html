<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards Study App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Flashcards Study App</h1>
      <button type="button" class="primary-btn" id="open-modal-btn">New Deck</button>
    </header>

    <div class="layout">
      <aside class="deck-sidebar" aria-label="Flashcard decks">
        <div class="sidebar-header">
          <h2>Decks</h2>
          <button type="button" class="icon-btn" id="edit-deck-btn" aria-label="Edit active deck">✎</button>
        </div>
        <ul class="deck-list" id="deck-list"></ul>
      </aside>

      <main class="study-panel">
        <section class="deck-view" aria-labelledby="deck-title">
          <div class="deck-meta">
            <div>
              <p class="deck-label">Current deck</p>
              <h2 id="deck-title">General Knowledge</h2>
            </div>
            <button type="button" class="secondary-btn" id="new-card-btn">New Card</button>
          </div>

          <div class="toolbar" role="toolbar" aria-label="Deck tools">
            <label class="search-field" for="card-search">
              <span class="sr-only">Search cards</span>
              <input id="card-search" type="search" placeholder="Search cards" aria-label="Search cards" />
            </label>
            <button type="button" aria-label="Shuffle cards">Shuffle</button>
          </div>
          <p class="search-results" id="search-results" role="status" aria-live="polite">Showing all cards</p>

          <article class="card flashcard" id="study-card" aria-label="Flashcard">
            <div class="flashcard-face front">
              <h3>Front</h3>
              <p id="study-card-front"></p>
            </div>
            <div class="flashcard-face back">
              <h3>Back</h3>
              <p id="study-card-back"></p>
            </div>
          </article>

          <div class="card-controls" role="group" aria-label="Flashcard controls">
            <button type="button" id="prev-card-btn">Previous</button>
            <button type="button" id="flip-card-btn">Flip</button>
            <button type="button" id="next-card-btn">Next</button>
          </div>

          <div class="card-manager">
            <div class="manager-header">
              <h3>Cards in Deck</h3>
            </div>
            <ul class="card-list" id="card-list"></ul>
          </div>
        </section>
      </main>
    </div>

    <footer>
      <p>Tip: Flip the card to reveal the answer, then move to the next one.</p>
    </footer>

    <div class="modal" id="deck-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-dialog" role="document">
        <button class="modal-close" type="button" aria-label="Close dialog">×</button>
        <h2 id="modal-title">New Deck</h2>
        <form id="deck-form" novalidate>
          <label for="deck-name">Deck name</label>
          <input id="deck-name" name="deckName" type="text" maxlength="40" aria-describedby="deck-error" />
          <p class="form-error" id="deck-error" role="alert"></p>
          <div class="modal-actions">
            <button type="button" class="danger-btn" id="delete-deck-btn" hidden>Delete Deck</button>
            <button type="button" class="secondary-btn" id="cancel-modal-btn">Cancel</button>
            <button type="submit" class="primary-btn">Save Deck</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal" id="card-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
      <div class="modal-dialog" role="document">
        <button class="modal-close" type="button" aria-label="Close dialog">×</button>
        <h2 id="card-modal-title">New Card</h2>
        <form id="card-form" novalidate>
          <label for="card-front">Front</label>
          <textarea id="card-front" name="front" rows="3" maxlength="160" aria-describedby="card-error"></textarea>
          <label for="card-back">Back</label>
          <textarea id="card-back" name="back" rows="3" maxlength="160" aria-describedby="card-error"></textarea>
          <p class="form-error" id="card-error" role="alert"></p>
          <div class="modal-actions">
            <button type="button" class="danger-btn" id="delete-card-btn" hidden>Delete Card</button>
            <button type="button" class="secondary-btn" id="cancel-card-btn">Cancel</button>
            <button type="submit" class="primary-btn">Save Card</button>
          </div>
        </form>
      </div>
    </div>

    <script src="storage.js"></script>
    <script src="app.js"></script>
  </body>
</html>
